<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Gerador de ícone</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      import { buildSprites, drawSprite, drawPlayer } from '../js/sprites.js';

      const params = new URLSearchParams(location.search);
      const size = Number(params.get('size') || 512);
      const maskable = params.get('maskable') === '1';
      const round = params.get('round') === '1';
      const c = document.getElementById('c');
      c.width = size;
      c.height = size;
      const ctx = c.getContext('2d');
      const S = buildSprites(20251101);

      ctx.scale(size / 512, size / 512);
      if (round) {
        ctx.beginPath();
        ctx.roundRect(0, 0, 512, 512, 112);
        ctx.clip();
      }
      // céu
      const sky = ctx.createLinearGradient(0, 0, 0, 512);
      sky.addColorStop(0, '#2f8fc6');
      sky.addColorStop(0.55, '#9ad8ea');
      sky.addColorStop(1, '#c5eec4');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, 512, 512);

      // conteúdo menor no ícone "maskable" (zona segura)
      const k = maskable ? 0.78 : 1;
      ctx.translate(256, 256);
      ctx.scale(k, k);
      ctx.translate(-256, -256);

      drawSprite(ctx, S.clouds[0], 120, 150, 0.7);
      drawSprite(ctx, S.clouds[2], 400, 110, 0.55);

      const cx = 256;
      const cy = 640;
      const R = 330;
      const tree = (sprite, ang, scale) => {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(ang);
        ctx.translate(0, -(R + 18));
        drawSprite(ctx, sprite, 0, 0, scale);
        ctx.restore();
      };
      tree(S.mountains[0], -0.42, 0.75);
      tree(S.pines[1], 0.36, 0.9);
      tree(S.trees[0], -0.2, 0.95);
      tree(S.trees[2], 0.22, 0.9);

      // grama do fundo
      ctx.fillStyle = '#69a015';
      ctx.beginPath();
      ctx.arc(cx, cy, R + 30, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#449123';
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#88c50d';
      ctx.beginPath();
      ctx.arc(cx, cy, R - 16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#9ccb28';
      ctx.beginPath();
      ctx.arc(cx, cy, R - 32, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#703a1b';
      ctx.beginPath();
      ctx.arc(cx, cy, R - 56, 0, Math.PI * 2);
      ctx.fill();

      // ponteiro de relógio (preto)
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(0.42);
      ctx.fillStyle = '#0b0b0d';
      const T = R + 22;
      ctx.beginPath();
      ctx.moveTo(-5, 0);
      ctx.lineTo(-5, -(R - 70));
      ctx.bezierCurveTo(-5, -(R - 62), -19, -(R - 60), -17, -(R - 40));
      ctx.bezierCurveTo(-16, -(R - 20), -6, -(R + 6), 0, -T);
      ctx.bezierCurveTo(6, -(R + 6), 16, -(R - 20), 17, -(R - 40));
      ctx.bezierCurveTo(19, -(R - 60), 5, -(R - 62), 5, -(R - 70));
      ctx.lineTo(5, 0);
      ctx.fill();
      ctx.restore();
      // numeral do mostrador
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.38);
      ctx.fillStyle = '#f8d977';
      ctx.font = '700 40px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText('XII', 0, -(R - 104));
      ctx.fillRect(-4, -(R - 64), 8, 22);
      ctx.restore();

      // personagem
      ctx.save();
      ctx.translate(cx - 6, cy - R);
      ctx.scale(3.4, 3.4);
      drawPlayer(ctx, { phase: 1.1, air: false, stopped: false, blink: false });
      ctx.restore();

      document.title = 'pronto';
    </script>
  </body>
</html>
